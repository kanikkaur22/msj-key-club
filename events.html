<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · MSJ Key Club</title>
  <link rel="icon" href="assets/bee.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body data-page="events">
  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">Events</p>
        <h1>Find your next way to serve.</h1>
        <p class="lead">Service projects, fundraisers, and division events — all in one place. Add any event to your calendar with one tap.</p>
      </div>
    </section>

    <section class="section" style="padding-top:90px">
      <div class="container">
        <div class="filters" role="group" aria-label="Filter events" id="filters"></div>
        <div class="event-list" id="events" aria-live="polite"></div>

        <h2 style="margin-top:110px;font-size:clamp(30px,3vw,48px)">Past events</h2>
        <div class="event-list" id="past" style="opacity:.75"></div>
      </div>
    </section>
  </main>

  <script src="data.js?v=13"></script>
  <script src="main.js?v=13"></script>
  <script>
    const filters = document.getElementById("filters");
    const out = document.getElementById("events");
    out.innerHTML = '<p class="empty">Loading events…</p>';
    let all = [], cats = [], active = "All";
    function render() {
      filters.innerHTML = cats.length > 2 ? cats.map((c) => `<button class="chip" aria-pressed="${c === active}">${KC.esc(c)}</button>`).join("") : "";
      const list = active === "All" ? all : all.filter((e) => e.category === active);
      out.innerHTML = list.length ? list.map(KC.eventCard).join("") : '<p class="empty">No upcoming events right now — check back soon or follow @msjkeyclub!</p>';
    }
    filters.addEventListener("click", (e) => {
      const b = e.target.closest(".chip"); if (!b) return;
      active = b.textContent; render();
    });
    KC.loadEvents().then((events) => {
      all = KC.upcoming(events);
      cats = ["All", ...new Set(all.map((e) => e.category).filter(Boolean))];
      render();
      const past = KC.past(events);
      document.getElementById("past").innerHTML = past.length
        ? past.map(KC.eventCard).join("") : '<p class="empty">Past events will show up here.</p>';
    });
  </script>
</body>
</html>
