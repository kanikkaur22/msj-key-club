<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · MSJ Key Club</title>
  <link rel="icon" href="assets/bee.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body data-page="events">
  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">Events</p>
        <h1>Find your next way to serve.</h1>
        <p class="lead">Service projects, fundraisers, and division events — all in one place. Tap any event for the details.</p>
      </div>
    </section>

    <section class="section" style="padding-top:72px">
      <div class="container">
        <div id="calendar"></div>
        <div class="btn-row" id="cal-actions" hidden style="margin-top:28px">
          <a class="btn btn-primary" id="subscribe" target="_blank" rel="noopener">Add to my Google Calendar <span data-icon="arrow"></span></a>
          <a class="btn btn-outline" data-link="joinForm" target="_blank" rel="noopener">Join the mailing list <span data-icon="arrow"></span></a>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js?v=16"></script>
  <script src="main.js?v=16"></script>
  <script>
    const phone = matchMedia("(max-width: 860px)").matches;
    document.getElementById("calendar").innerHTML = KC.calendar(phone ? "AGENDA" : "MONTH", phone ? 560 : 680);
    if (window.CLUB.calendarId) {
      document.getElementById("cal-actions").hidden = false;
      document.getElementById("subscribe").href = KC.subscribeLink();
    }
  </script>
</body>
</html>
