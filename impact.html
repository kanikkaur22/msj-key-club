<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Impact · MSJ Key Club</title>
  <link rel="icon" href="assets/bee.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="impact">
  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">Our impact</p>
        <h1>Small acts. Big buzz.</h1>
        <p class="lead">Here's what the hive is working toward this year.</p>
      </div>
    </section>

    <section class="section" style="padding-top:72px">
      <div class="container">
        <p class="eyebrow">Club goals</p>
        <h2>This year's targets</h2>
        <div class="grid-2 grid-4" id="goals" style="margin-top:28px"></div>
      </div>
    </section>

    <section class="section section-tint">
      <div class="container">
        <p class="eyebrow">Showing up</p>
        <h2>Attendance at DCMs and major events</h2>
        <p class="lead">Minimum number of members we want at each.</p>
        <div class="attend" id="attendance"></div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="main.js"></script>
  <script>
    const C = window.CLUB;
    const ICONS = ["users", "users", "heart", "sparkles"];
    const fmt = (g, n) => (g.prefix || "") + Number(n).toLocaleString();
    document.getElementById("goals").innerHTML = C.goals.map((g, i) => {
      const has = typeof g.current === "number";
      const pct = has ? Math.min(100, Math.round((g.current / g.target) * 100)) : 0;
      return `<div class="card goal reveal">
        <div class="icon-chip">${icon(ICONS[i % ICONS.length])}</div>
        <div class="n" data-i="${i}">${fmt(g, g.target)}</div>
        <div class="l">${KC.esc(g.label)}</div>
        ${g.note ? `<div class="note">${KC.esc(g.note)}</div>` : ""}
        ${has ? `<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${g.target}" aria-valuenow="${g.current}"><span data-pct="${pct}"></span></div>
                 <div class="progress-text">${fmt(g, g.current)} so far · ${pct}%</div>` : ""}
      </div>`;
    }).join("");

    document.getElementById("attendance").innerHTML = C.attendance.map((a) => `
      <div class="card reveal in">
        <div class="people">${a.people}${a.people === 1 ? "+" : ""}</div>
        <div class="sub">${a.people === 1 ? "person" : "people"}</div>
        <div class="ev">${KC.esc(a.event)}</div>
        ${a.full ? `<div class="sub">${KC.esc(a.full)}</div>` : ""}
        ${a.note ? `<div class="sub">${KC.esc(a.note)}</div>` : ""}
      </div>`).join("");

    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      e.target.classList.add("in");
      const n = e.target.querySelector(".n");
      if (n) { const g = C.goals[n.dataset.i]; KC.countUp(n, g.target, g.prefix || "", ""); }
      const bar = e.target.querySelector(".progress span");
      if (bar) bar.style.width = bar.dataset.pct + "%";
    }), { threshold: 0.3 });
    document.querySelectorAll(".goal").forEach((el) => io.observe(el));
  </script>
</body>
</html>
