<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Our Impact · MSJ Key Club</title>
  <link rel="icon" href="assets/bee.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body data-page="impact">
  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">Our impact</p>
        <h1>Small acts. Big buzz.</h1>
        <p class="lead">Here's what the hive has accomplished recently.</p>
      </div>
    </section>

    <section class="section" id="stats-section" style="padding-top:72px" hidden>
      <div class="container">
        <p class="eyebrow">By the numbers</p>
        <h2>What we've done</h2>
        <div class="grid-3" id="stats" style="margin-top:28px"></div>
      </div>
    </section>

    <section class="section section-tint" id="recent-section" hidden>
      <div class="container">
        <p class="eyebrow">Recent impact</p>
        <h2>From our past events</h2>
        <div class="grid-3" id="recent" style="margin-top:28px"></div>
      </div>
    </section>

    <section class="section" id="empty-section" style="padding-top:72px" hidden>
      <div class="container">
        <p class="empty">Photos and numbers from our recent events are coming soon. Follow <a data-link-social target="_blank" rel="noopener">@msjkeyclub</a> to see what we've been up to!</p>
      </div>
    </section>
  </main>

  <script src="data.js?v=13"></script>
  <script src="main.js?v=13"></script>
  <script>
    const C = window.CLUB;
    const stats = C.impactStats || [];
    const recent = C.recentImpact || [];
    const ICONS = ["heart", "users", "sparkles", "pin"];

    if (stats.length) {
      document.getElementById("stats-section").hidden = false;
      document.getElementById("stats").innerHTML = stats.map((s, i) => `
        <div class="card goal reveal">
          <div class="icon-chip">${icon(ICONS[i % ICONS.length])}</div>
          <div class="n" data-i="${i}">${(s.prefix || "") + Number(s.value).toLocaleString()}</div>
          <div class="l">${KC.esc(s.label)}</div>
          ${s.note ? `<div class="note">${KC.esc(s.note)}</div>` : ""}
        </div>`).join("");
    }

    if (recent.length) {
      document.getElementById("recent-section").hidden = false;
      document.getElementById("recent").innerHTML = recent.map((r) => {
        const date = r.date ? KC.parseDate(r.date).toLocaleDateString("en-US", { month: "long", year: "numeric" }) : "";
        return `<article class="card impact-card reveal in">
          ${r.photo ? `<img src="${KC.esc(r.photo)}" alt="${KC.esc(r.title)}" loading="lazy">` : ""}
          <div class="impact-body">
            ${date ? `<span class="tag">${date}</span>` : ""}
            <h3>${KC.esc(r.title)}</h3>
            ${r.text ? `<p>${KC.esc(r.text)}</p>` : ""}
          </div>
        </article>`;
      }).join("");
    }

    if (!stats.length && !recent.length) {
      document.getElementById("empty-section").hidden = false;
      document.querySelectorAll("[data-link-social]").forEach((a) => (a.href = C.contact.socialUrl));
    }

    const io = new IntersectionObserver((entries) => entries.forEach((e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      e.target.classList.add("in");
      const n = e.target.querySelector(".n");
      if (n) { const s = stats[n.dataset.i]; KC.countUp(n, s.value, s.prefix || "", ""); }
    }), { threshold: 0.3 });
    document.querySelectorAll("#stats .goal").forEach((el) => io.observe(el));
  </script>
</body>
</html>
